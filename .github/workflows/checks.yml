name: checks

# What can run without the game. A full build needs a Polestar clone's reference data, and part of that data is read
# from the game's client: building and the tests run on a machine with the game (README).

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: The Lua files parse
        run: luac5.1 -p planner/*.lua tests/*.lua
      - name: The translations are whole
        run: lua5.1 tests/locale.lua
      - name: The JavaScript files parse
        run: for f in tools/*.js tests/*.js; do node --check "$f"; done
      - name: The JSON files parse
        run: node -e "for (const f of process.argv.slice(1)) JSON.parse(require('node:fs').readFileSync(f, 'utf8'))" pack.json tools/known-out.json scope/*.json
