name: release

# Publishes the committed zip when a version is tagged. GitHub cannot build the addon, since that needs the game's client:
# tools/release.js makes the zip on a machine with the game (README).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check the zip and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(node tools/check-release.js "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
